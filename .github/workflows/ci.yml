name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: Check & test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm test
